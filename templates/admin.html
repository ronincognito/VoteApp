<!DOCTYPE html>
<html lang="nl">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/admin/apple-touch-icon.png') }}">
	<link rel="icon" href="{{ url_for('static', filename='images/admin/favicon.ico') }}" sizes="any">
	<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/admin/favicon-192x192.png') }}">
	<title>FGW Beheer</title>
	<meta name="apple-mobile-web-app-title" content="FGW Beheer"> <!-- name under the home screen icon on iOS -->
	<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<div class="content-container">
	<main class="card admin-card">
	<header class="brand">
		<div class="logo admin" aria-hidden="true">
			<svg viewBox="0 0 32 32" width="32" height="32"><path fill="currentColor" d="M18.0737619,0 C18.5795574,0 19.0179136,0.404636459 19.085353,0.910432034 L19.3888303,3.84404636 C20.4004215,4.113804 21.3108535,4.48472076 22.1875659,4.99051633 L24.4805058,3.13593256 C24.8851423,2.79873551 25.4920969,2.83245522 25.8630137,3.20337197 L28.796628,6.1369863 C29.1675448,6.50790306 29.2012645,7.11485774 28.8640674,7.5194942 L27.0094837,9.81243414 C27.4815595,10.6891465 27.886196,11.6332982 28.1559536,12.6111697 L31.089568,12.914647 C31.5953635,12.9820864 32,13.4204426 32,13.9599579 L32,18.0737619 C32,18.5795574 31.6290832,19.0179136 31.089568,19.085353 L28.1559536,19.3888303 C27.886196,20.4004215 27.5152792,21.3108535 27.0094837,22.1875659 L28.8640674,24.4805058 C29.2012645,24.8851423 29.1675448,25.4920969 28.796628,25.8630137 L25.8630137,28.796628 C25.4920969,29.1675448 24.8851423,29.2012645 24.4805058,28.8640674 L22.1875659,27.0094837 C21.3108535,27.4815595 20.3667018,27.886196 19.3888303,28.1559536 L19.085353,31.089568 C19.0516333,31.5953635 18.6132771,32 18.0737619,32 L13.9262381,32 C13.4204426,32 12.9820864,31.6290832 12.914647,31.089568 L12.6111697,28.1559536 C11.5995785,27.886196 10.6891465,27.5152792 9.81243414,27.0094837 L7.5194942,28.8640674 C7.11485774,29.2012645 6.50790306,29.1675448 6.1369863,28.796628 L3.20337197,25.8630137 C2.83245522,25.4920969 2.79873551,24.8851423 3.13593256,24.4805058 L4.99051633,22.1875659 C4.51844046,21.3108535 4.113804,20.3667018 3.84404636,19.3888303 L0.910432034,19.085353 C0.404636459,19.0516333 0,18.6132771 0,18.0737619 L0,13.9262381 C0,13.4204426 0.370916754,12.9820864 0.910432034,12.914647 L3.84404636,12.6111697 C4.113804,11.5995785 4.48472076,10.6891465 4.99051633,9.81243414 L3.13593256,7.5194942 C2.79873551,7.11485774 2.83245522,6.50790306 3.20337197,6.1369863 L6.1369863,3.20337197 C6.50790306,2.83245522 7.11485774,2.79873551 7.5194942,3.13593256 L9.81243414,4.99051633 C10.6891465,4.51844046 11.6332982,4.113804 12.6111697,3.844046 		</div>
		<div>
			<div class="club">FGW</div>
			<div class="tagline">Stemrondebeheer</div>
		</div>
	</header>
	<p id="voteStatus" class="message">Klaar om een nieuwe ronde te openen</p>
	<div id="roundArea">
		<div id="voteCount"></div>
		<div id="result"></div>
		<div id="chartContainer" style="display:none;"><canvas id="voteChart"></canvas></div>
	</div>
	<button id="openVoteBtn" class="wide-btn">Open nieuwe ronde</button>
	<button id="closeVoteBtn" class="wide-btn" style="display:none;">Sluit stemronde</button>
	</main>

	<div class="below-panel">
		<button id="storedResultsBtn">OPGESLAGEN RESULTATEN</button>
		<!-- Toggle to control repeated vote check, shown instead of the stored results button while a round is open -->
		<div id="voteCheckContainer">
		  <label for="toggleVoteCheck" id="voteCheckLabel">Stemlimiet</label>
		  <label class="switch">
			<input type="checkbox" id="toggleVoteCheck">
			<span class="sliderToggle"></span>
		  </label>
		</div>
		<form id="logoutForm" method="post" action="/admin/logout"><button id="logoutBtn" type="submit">UITLOGGEN</button></form>
	</div>
	
    <div id="downloadOverlay" class="overlay">
        <div class="overlay-content">
            <h1>Opgeslagen resultaten</h1>
            <p id="voteCountOverlay"></p>
            <button id="confirmDownloadBtn" class="wide-btn">Download data</button>
            
             <!-- Table for showing last 20 voting results -->
			 <div>
				 <table id="voteResultsTable" >
					 <thead>
						 <tr>
							 <th>Datum|Tijd</th>
							 <th>Gem.</th>
							 <th>St.dev.</th>
							 <th>Stemlijst</th>
							 <th>Gebruikers</th>
						 </tr>
					 </thead>
					 <tbody>
						 <!-- Rows will be dynamically inserted here -->
					 </tbody>
				 </table>
			 </div>
            <button id="clearDataBtn">WIS ALLE DATA</button>
            <button id="closeOverlayBtn" aria-label="Sluiten"></button>
        </div>
    </div>

	<!-- Delete Confirmation Modal -->
	<div id="deleteConfirmModal" class="modal" style='display:none'>
		<div class="modal-content">
			<h2>Alle opgeslagen stemrondes en gebruikersnummers wissen?</h2>
			<p>Download eerst de data als je die wilt bewaren</p>
			<button id="confirmClearDataBtn" class="wide-btn">Ja, wis alle data</button>
			<button id="cancelClearDataBtn" class="wide-btn">Annuleer</button>
		</div>
	</div>

	<script>
	
		// login expired (e.g. after 30 days, or the code's secret key changed): reload, which shows the login screen
		const originalFetch = window.fetch;
		window.fetch = (...args) => originalFetch(...args).then(response => {
			if (response.status === 401) location.reload();
			return response;
		});

		// Get the modal and buttons
		const deleteConfirmModal = document.getElementById('deleteConfirmModal');
		const clearDataBtn = document.getElementById('clearDataBtn');
		const confirmClearDataBtn = document.getElementById('confirmClearDataBtn');
		const cancelClearDataBtn = document.getElementById('cancelClearDataBtn');
	    let voteChartInstance = null;

		document.getElementById('toggleVoteCheck').addEventListener('change', function () {
			fetch('/toggle_vote_check', {method: 'POST'})
				.then(response => response.json())
				.then(data => {
					//document.getElementById('statusMessage').innerText = data.status;
					document.getElementById('toggleVoteCheck').checked = data.status.includes('enabled');
				});
		});		
		
		document.getElementById('openVoteBtn').addEventListener('click', function() {
		    fetch('/open_vote', {method: 'POST'})
		        .then(response => response.json())
		        .then(data => {
		            document.getElementById('voteStatus').innerText = data.status;
		            showOpenRound();
		        });
		});

		// show the controls for an open round: after pressing 'open', and when the page is (re)loaded while a round is open
		function showOpenRound() {
		    document.getElementById('openVoteBtn').style.display = 'none';
		    document.getElementById('closeVoteBtn').style.display = 'block';
		    document.getElementById('result').innerHTML = '';
		    document.getElementById('storedResultsBtn').style.display = 'none';
		    document.getElementById('voteCheckContainer').style.display = 'flex';
		    document.getElementById('voteCount').style.display = 'block';
		    // Hide the chart
		    document.getElementById('chartContainer').style.display = 'none';
		    updateVoteCount();
		}

		document.getElementById('closeVoteBtn').addEventListener('click', function() {
			console.log("closeVoteBtn");
			fetch('/close_vote', { method: 'POST' })
				.then(response => response.json())
				.then(data => {
					document.getElementById('voteStatus').innerText = data.status;
					document.getElementById('openVoteBtn').style.display = 'block';
					document.getElementById('closeVoteBtn').style.display = 'none';
					document.getElementById('storedResultsBtn').style.display = 'block';
					document.getElementById('voteCheckContainer').style.display = 'none';
					document.getElementById('voteCount').style.display = 'none';

					
					console.log('votes:', data.votes);
					
					if (!data.votes || data.votes.length === 0) return; // skip if there is no voting data (the message stays 'Stemronde is gesloten')

					document.getElementById('voteStatus').innerText = 'Resultaten van deze ronde';
					document.getElementById('result').innerHTML =
						`<span class="label">Gemiddeld</span><span class="value">${data.avg.toFixed(2)}</span>` +
						`<span class="label">Standaardafwijking</span><span class="value">${data.sdev.toFixed(2)}</span>` +
						`<span class="label">Mediaan</span><span class="value">${data.median.toFixed(2)}</span>`;

					// Destroy existing chart instance if it exists
					if (voteChartInstance !== null) {
						voteChartInstance.destroy();
					}
					// Define bin edges (e.g., 1.0-1.5, 1.5-2.0, ..., 9.5-10)
					const binSize = 0.5;
					const bins = [];
					for (let i = 1; i <= 10; i += binSize) {
						bins.push(i.toFixed(1)); // Creates labels like ['1.0', '1.5', ..., '10.0']
					}

					const votes = data.votes || []; // Example: [1.2, 3.5, 7.8, 2.2, ...]
					const voteCounts = new Array(bins.length).fill(0);
					votes.forEach(voteTuple => {
						let vote = voteTuple[0]; // Extract the value from the tuple (e.g., 5.5)
						let binIndex = Math.floor((vote - 1) / binSize);
						if (binIndex >= 0 && binIndex < voteCounts.length) {
							voteCounts[binIndex]++;
						}
					});
					console.log('voteCounts:', voteCounts);
					
					let maxValue =10; // vertical scale assumes max nr of occurrences of a single vote value
					document.getElementById('chartContainer').style.display = 'block'; // Show the chart
		
					// Create a new chart instance
					const ctx = document.getElementById('voteChart').getContext('2d');
					voteChartInstance = new Chart(ctx, {
						type: 'bar',
						data: {
							labels: bins,
							datasets: [{
								data: voteCounts.map(n => n || null), // no stub for empty bins
								backgroundColor: '#c3c3c3',
								borderWidth: 0,
								barThickness: 10,
								borderRadius: { topLeft: 5, topRight: 5 },
								borderSkipped: 'bottom'
							}]
						},
						options: {
							maintainAspectRatio: false, // fill #chartContainer
							animation: false,
							plugins: {
								legend: {
									display: false // Hides the legend
								}
							},
							scales: {
								x: {
									grid: {
										display: false // Hides vertical gridlines (x-axis)
									},
									border: {
										display: false
									},
									ticks: {
										autoSkip: false,
										maxRotation: 0,
										color: '#222222',
										font: { size: 11, weight: 300 },
										// bars are per half point, label only the whole numbers
										callback: function(value) {
											const label = this.getLabelForValue(value);
											return label.endsWith('.0') ? String(parseInt(label)) : '';
										}
									}
								},
								y: {
									display: false, // Hides the entire y-axis (including labels and line)
									grid: {
										display: false,
									},
									beginAtZero: true,
									min: 0,          // Set minimum value to 0
									max: maxValue,   // Set maximum value to at least 5
									ticks: {
										stepSize: 1,  // Ensure the y-axis increments by 1
										callback: function(value) {
											return Number.isInteger(value) ? value : null; // Show only integers
										}
									}
								}
							}
						}
					});
				})
				.catch(error => {
					console.error('Error:', error);
				});
		});
		
		function updateVoteCount() {
		    fetch('/vote_count')
		        .then(response => response.json())
		        .then(data => {
		            document.getElementById('voteCount').innerText = `${data.count}`;
		            if (document.getElementById('closeVoteBtn').style.display === 'block') {
		                setTimeout(updateVoteCount, 1000);
		            }
		        });
		}
		
		// Open the overlay
		document.getElementById('storedResultsBtn').addEventListener('click', function() {
			fetch('/stored_vote_count')
				.then(response => response.json())
				.then(data => {
					document.getElementById('voteCountOverlay').innerText = 
					(data.count != 0) 
						? ((data.count == 1) ? 'Er is 1 opgeslagen stemronde' : 'Er zijn ' + data.count + ' opgeslagen stemrondes') + ((data.count > 10) ? ', de 10 meest recente staan hieronder' : '')
						: 'Er zijn geen opgeslagen stemrondes';
					document.getElementById('downloadOverlay').style.display = 'block';
					document.getElementById('confirmDownloadBtn').disabled = document.getElementById('clearDataBtn').disabled = (data.count == 0);
					if (data.count == 0) {
						document.getElementById('voteResultsTable').style.display = 'none';
					} else {
						document.getElementById('voteResultsTable').style.display = 'table';
						updateVoteResultsTable(data.last_10_votes); // Populate the table
					}
				});
		});
		
		// Close the overlay
		document.getElementById('closeOverlayBtn').addEventListener('click', function() {
			document.getElementById('downloadOverlay').style.display = 'none';
		});
		
		// Download the CSV file
		document.getElementById('confirmDownloadBtn').addEventListener('click', function() {
			window.location.href = '/download_csv';
			document.getElementById('downloadOverlay').style.display = 'none';
		});
		
		// Show the modal when "clearDataBtn" is clicked
		clearDataBtn.addEventListener('click', function() {
			deleteConfirmModal.style.display = 'block';
		});
		
		// Hide the modal and do nothing when "cancelClearDataBtn" is clicked
		cancelClearDataBtn.addEventListener('click', function() {
			deleteConfirmModal.style.display = 'none';
		});
		
		// Perform the data clearing action when "confirmClearDataBtn" is clicked
		confirmClearDataBtn.addEventListener('click', function() {
			// Call your API to clear data here
			fetch('/clear_votes', { method: 'POST' })
				.then(response => response.json())
				.then(data => {
					// alert('Stemrondes gewist');
					// console.log('Data cleared:', data);
					
					// Hide the modal after clearing and the overlay
					deleteConfirmModal.style.display = 'none';
					document.getElementById('downloadOverlay').style.display = 'none';
				});
		});

		// Function to update the table
		function updateVoteResultsTable(results) {
			const tableBody = document.getElementById('voteResultsTable').querySelector('tbody');
			tableBody.innerHTML = ''; // Clear existing table data
				
			results.forEach(result => {
				const row = document.createElement('tr');
				
				// Create cells for each field
				const datetimeCell = document.createElement('td');
				datetimeCell.textContent = result.timestamp;
				datetimeCell.style.border = '1px solid black';
		
				const avgCell = document.createElement('td');
				avgCell.textContent = result.avg;
				avgCell.style.border = '1px solid black';
		
				const sdevCell = document.createElement('td');
				sdevCell.textContent = result.sdev;
				sdevCell.style.border = '1px solid black';
		
				const votesCell = document.createElement('td');
				votesCell.textContent = result.votes.join(', ');
				votesCell.style.border = '1px solid black';
				
				const userCell = document.createElement('td');
				userCell.textContent = result.users.join(', ');
				userCell.style.border = '1px solid black';
		
		
				// Append cells to the row
				row.appendChild(datetimeCell);
				row.appendChild(avgCell);
				row.appendChild(sdevCell);
				row.appendChild(votesCell);
				row.appendChild(userCell);
		
				// Append row to the table body
				tableBody.appendChild(row);
			});
		}
		
		document.addEventListener('DOMContentLoaded', function () {
			document.getElementById('voteCheckContainer').style.display = 'none';			
			// Now fetch and set the checkbox state
			fetch('/get_vote_check_status')
				.then(response => response.json())
				.then(data => {
					document.getElementById('toggleVoteCheck').checked = data.status;
				});
			// a round may already be open (page reloaded, or app restarted with a saved open round):
			// then show 'close', otherwise pressing 'open' would start a new round and discard the votes so far
			fetch('/voting_status')
				.then(response => response.json())
				.then(data => {
					if (data.voting_open) {
						document.getElementById('voteStatus').innerText = 'Er kan nu gestemd worden';
						showOpenRound();
					}
				});
		});

</script>
</body>
</html>
