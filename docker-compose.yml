# Synology (Container Manager) or Mac (Docker Desktop):
#   docker compose up -d --build
# See Instructions/Running on Synology with Docker.md
services:
  voteapp:
    build: .
    image: voteapp:latest
    container_name: voteapp
    restart: unless-stopped
    # DSM user the app runs as and that owns the files in data/. Recommended: a user without
    # admin rights, set in .env (APP_UID, APP_ADMIN_GID=100); see the guide, "A user for the containers".
    # The defaults (first DSM user plus group administrators, 101) are for running it as yourself:
    # DSM's ACL on the shared folder "docker" only gives administrators write access.
    user: "${APP_UID:-1026}:${APP_GID:-100}"
    group_add:
      - "${APP_ADMIN_GID:-101}"
    # the app needs no special privileges, and nothing in the container may become root
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "8080:8080"   # DSM's reverse proxy sends https://...:443 to localhost:8080
    volumes:
      - ./data:/app/data
    environment:
      TZ: Europe/Amsterdam
      # UPLOAD_URL: https://example.synology.me:8443/   # where /upload forwards to (default: same host, port 8443)
